name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest -v
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python -m build
      - run: python -m pip check
      - name: Dependency advisory audit
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python -m pip install pip-audit==2.9.0
          python -m pip_audit -r requirements-dev.txt
      - name: Installed wheel and offline CLI smoke
        run: |
          python -m pip install --no-deps dist/*.whl
          cd "${RUNNER_TEMP}"
          arc-rpc-evidence demo --scenario null-receipt --output "arc-evidence-${{ matrix.python }}"
          arc-rpc-evidence demo --scenario tip-recover
          arc-rpc-evidence --help
